<script>
  var IDLE_POOL = ['idle', 'idle-bubble', 'happy', 'react-right'];
  var currentMood = 'idle';
  var idleTimer = null;

  function setMood(name) {
    if (name !== 'idle') {
      clearIdleTimer();
    }
    var all = document.querySelectorAll('.mood');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    var el = document.getElementById('mood-' + name);
    if (el) el.classList.add('active');
    currentMood = name;

    if (name === 'idle') startIdleRotation();
  }

  function startIdleRotation() {
    clearIdleTimer();
    idleTimer = setInterval(function() {
      if (currentMood !== 'idle') return;
      var pick = IDLE_POOL[Math.floor(Math.random() * IDLE_POOL.length)];
      var all = document.querySelectorAll('.mood');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
      var el = document.getElementById('mood-' + pick);
      if (el) el.classList.add('active');
    }, 15000);
  }

  function clearIdleTimer() {
    if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
  }

  window.petEngine = {
    onTap: function() { showBubble('Yuna～'); },
    onDoubleTap: function() { showBubble('轻一点嘛～'); },
    onLongPress: function() { showBubble('嗯？怎么啦～'); },
    onCombo: function(c) { showBubble(c >= 8 ? '别戳啦，会疼的～' : (c >= 5 ? '乖乖的～' : '喜欢你～')); },
    setMood: function(name) { setMood(name); }
  };

  function showBubble(text) {
    var old = document.getElementById('bubble');
    if (old) old.remove();
    var b = document.createElement('div');
    b.id = 'bubble';
    b.textContent = text;
    b.style.cssText = 'position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#333;padding:6px 12px;border-radius:12px;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,0.2);white-space:nowrap;';
    document.body.appendChild(b);
    setTimeout(function(){ b.remove(); }, 2000);
  }

  startIdleRotation();
</script>
